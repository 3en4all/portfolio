<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui,Segoe UI,sans-serif">
  <title>Schemat poglądowy: automatyczna produkcja treści</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7aa7ff"/></marker>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#0f1726"/>
  <text x="48" y="64" fill="#e6eaf2" font-size="30" font-weight="700">Kolejka produkcji filmu</text>
  <text x="48" y="96" fill="#9aa6bb" font-size="18">schemat poglądowy · każdy krok to osobne zadanie w kolejce, z logiem i ponowieniem po błędzie</text>
  <g font-size="22" fill="#e6eaf2">
    <g transform="translate(48,140)"><rect width="320" height="170" rx="14" fill="#16233a" stroke="#2f4a7a"/><text x="24" y="44" font-weight="700" fill="#7aa7ff">1 · Plan</text><text x="24" y="86">temat, kanały, termin</text><text x="24" y="120" fill="#9aa6bb" font-size="18">arkusz → kolejka zadań</text></g>
    <g transform="translate(440,140)"><rect width="320" height="170" rx="14" fill="#16233a" stroke="#2f4a7a"/><text x="24" y="44" font-weight="700" fill="#7aa7ff">2 · Tekst</text><text x="24" y="86">scenariusz i opisy</text><text x="24" y="120" fill="#9aa6bb" font-size="18">lokalny model językowy</text><rect x="24" y="134" width="210" height="26" rx="13" fill="#c9a24a"/><text x="38" y="153" font-size="15" fill="#111" font-weight="700">człowiek zatwierdza</text></g>
    <g transform="translate(832,140)"><rect width="320" height="170" rx="14" fill="#16233a" stroke="#2f4a7a"/><text x="24" y="44" font-weight="700" fill="#7aa7ff">3 · Lektor</text><text x="24" y="86">nagranie głosu</text><text x="24" y="120" fill="#9aa6bb" font-size="18">synteza mowy (TTS)</text></g>
    <g transform="translate(832,400)"><rect width="320" height="170" rx="14" fill="#16233a" stroke="#2f4a7a"/><text x="24" y="44" font-weight="700" fill="#7aa7ff">4 · Kontrola mowy</text><text x="24" y="86">odsłuch maszynowy</text><text x="24" y="120" fill="#9aa6bb" font-size="18">ASR porównuje z tekstem</text></g>
    <g transform="translate(440,400)"><rect width="320" height="170" rx="14" fill="#16233a" stroke="#2f4a7a"/><text x="24" y="44" font-weight="700" fill="#7aa7ff">5 · Montaż</text><text x="24" y="86">obraz, napisy, muzyka</text><text x="24" y="120" fill="#9aa6bb" font-size="18">FFmpeg</text><rect x="24" y="134" width="210" height="26" rx="13" fill="#c9a24a"/><text x="38" y="153" font-size="15" fill="#111" font-weight="700">człowiek zatwierdza</text></g>
    <g transform="translate(48,400)"><rect width="320" height="170" rx="14" fill="#16233a" stroke="#2f4a7a"/><text x="24" y="44" font-weight="700" fill="#7aa7ff">6 · Publikacja</text><text x="24" y="86">kilka kanałów naraz</text><text x="24" y="120" fill="#9aa6bb" font-size="18">API platform, opisy, miniatury</text></g>
  </g>
  <g stroke="#7aa7ff" stroke-width="3" fill="none" marker-end="url(#g)">
    <path d="M372 225H434"/><path d="M764 225H826"/><path d="M992 314V394"/><path d="M828 485H766"/><path d="M436 485H374"/>
    <path d="M1152 470H1184V250H1158" stroke-dasharray="7 7" opacity=".75"/>
  </g>
  <text x="1006" y="362" fill="#9aa6bb" font-size="15">błąd wymowy → ponów</text>
</svg>
