<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AnnDecor — propozycje strony</title>
<style>
:root{--bg:#0f1115;--line:#262c36;--text:#e6e8eb;--mute:#9aa3ae}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--line:#dfe3e8;--text:#14181e;--mute:#5b6570}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px}
p{color:var(--mute);margin:0 0 32px}
figure{margin:0 0 40px}
img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px}
figcaption{margin-top:10px;color:var(--mute);font-size:15px}
figcaption b{color:var(--text)}
</style>
</head>
<body>
<main>
<h1>AnnDecor — trzy kierunki strony</h1>
<p>Szkice wyglądu górnej części strony. W miejscu kolorowych pól pojawią się Państwa zdjęcia realizacji.</p>
<figure><img src="koncepcje/anndecor/a-ciepla.png" alt="Wariant A: ciepła, pudrowe róże, formularz zapytania o termin" width="1280" height="800"><figcaption><b>A · Ciepła</b> — pudrowe róże, duże zdjęcie i formularz z datą oraz liczbą gości.</figcaption></figure>
<figure><img src="koncepcje/anndecor/b-wieczorowa.png" alt="Wariant B: wieczorowa, ciemne tło ze złotem, mozaika zdjęć" width="1280" height="800"><figcaption><b>B · Wieczorowa</b> — ciemne tło i złoto, mozaika zdjęć, elegancko jak na sali po zmroku.</figcaption></figure>
<figure><img src="koncepcje/anndecor/c-jasna.png" alt="Wariant C: jasna, filtry kategorii i karty realizacji" width="1280" height="800"><figcaption><b>C · Jasna</b> — lekka, z filtrem realizacji (wesela, eventy, przyjęcia), dobra przy dużej liczbie zdjęć.</figcaption></figure>
</main>
</body>
</html>
