<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>AnnDecor — wariant A</title>
<style>
body{margin:0;background:#fbf7f3;color:#2e2523;font:16px/1.7 system-ui,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 64px}
header b{font:italic 600 28px Georgia,serif;color:#9c5b4a}header span{margin-left:28px;color:#7a6a64;font-size:15px}
.hero{position:relative;margin:8px 64px;height:360px;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#e9c9b8 0%,#c98f7c 45%,#6d4a52 100%)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 30%,#fff6 0 6%,transparent 7%),radial-gradient(circle at 85% 55%,#fff4 0 4%,transparent 5%),radial-gradient(circle at 65% 70%,#fff3 0 9%,transparent 10%)}
.hero div{position:absolute;left:56px;bottom:56px;color:#fff;max-width:600px}
.hero h1{font:600 50px/1.1 Georgia,serif;margin:0 0 12px}.hero p{margin:0 0 20px;font-size:18px;opacity:.9}
.hero a{display:inline-block;background:#fff;color:#6d4a52;padding:13px 24px;border-radius:30px;font-weight:600}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:28px 64px 0}
.gal i{height:130px;border-radius:6px;background:#d9b3a3}.gal i:nth-child(2){background:#b98a8a}.gal i:nth-child(3){background:#8d6b70}
.ask{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 64px;padding:24px;background:#fff;border-radius:6px;box-shadow:0 8px 24px #6d4a5214}
.ask label{font-size:13px;color:#7a6a64}.ask span{display:block;border-bottom:1px solid #e3d6cf;padding:6px 0;margin-top:4px}
.ask em{font-style:normal;align-self:end;text-align:center;background:#9c5b4a;color:#fff;padding:12px;border-radius:30px;font-weight:600}
</style></head><body>
<header><b>AnnDecor</b><nav><span>Realizacje</span><span>Usługi</span><span>O nas</span><span>Kontakt</span></nav></header>

<div class="gal"><i></i><i></i><i></i></div>
<div class="ask"><div><label>Rodzaj wydarzenia</label><span>Wesele</span></div><div><label>Data</label><span>14.06.2027</span></div><div><label>Liczba gości</label><span>120</span></div><em>Zapytaj o termin</em></div>
</body></html>
